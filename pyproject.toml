[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "eve-diagnostic-booking-api"
version = "0.1.0"
description = "Diagnostic test booking backend"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.14.1",
    "email-validator==2.2.0",
    "fastapi==0.115.8",
    "psycopg[binary]==3.2.4",
    "pydantic-settings==2.7.1",
    "pyjwt==2.10.1",
    "pwdlib[argon2]==0.2.1",
    "sqlalchemy==2.0.37",
    "uvicorn[standard]==0.34.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.hatch.build.targets.wheel]
packages = ["app"]
